<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Session Summary</title>
  <style>
    :root{
      --bg:#111214;
      --panel:#1a1c20;
      --panel-2:#20232a;
      --border:#2d3138;
      --text:#f1f3f5;
      --muted:#a7adb7;
      --muted-2:#7d8591;
      --heat-0:#1b1d21;
      --heat-1:#2a2023;
      --heat-2:#452228;
      --heat-3:#61232d;
      --heat-4:#7a1f2b;
      --heat-5:#9a2a39;
      --heat-6:#b9384a;
      --heat-7:#d75569;
      --heat-8:#ee7c8f;
      --radius:22px;
      --shadow:0 12px 30px rgba(0,0,0,.28);
    }
    * { box-sizing:border-box; }
    html, body {
      margin:0; padding:0; background:transparent; color:var(--text);
      font-family:Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body { min-height:100vh; }
    .app {
      width:100%; max-width:none; margin:0; padding:12px;
      background:linear-gradient(180deg, #131519 0%, #111214 100%);
    }
    .card {
      width:100%; margin:0; padding:16px;
      background:linear-gradient(180deg,var(--panel) 0%, var(--panel-2) 100%);
      border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow);
    }
    .title {
      margin:0 0 14px 0; font-size:18px; line-height:1.15; font-weight:800;
      color:var(--text); letter-spacing:-0.02em;
    }
    .stats-grid {
      display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px;
    }
    .stat-card {
      min-height:104px; padding:14px 14px 12px;
      background:linear-gradient(180deg,#1d2026 0%, #1a1c20 100%);
      border:1px solid var(--border); border-radius:18px;
      display:flex; flex-direction:column; justify-content:space-between;
    }
    .label {
      color:var(--muted); letter-spacing:.1em; text-transform:uppercase;
      font-weight:800; font-size:11px; line-height:1.1;
    }
    .value {
      color:var(--text); font-weight:900; font-size:18px; line-height:1; margin-top:2px;
    }
    .subtle {
      color:var(--muted-2); font-size:11px; line-height:1.25; margin-top:6px;
    }
    .summary-row {
      display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-bottom:14px; padding:10px 0 0;
    }
    .summary-chip {
      background:#181a1f; border:1px solid var(--border); border-radius:14px; padding:10px 8px; text-align:center;
    }
    .summary-chip .chip-label {
      display:block; color:var(--muted); font-size:10px; text-transform:uppercase;
      letter-spacing:.08em; font-weight:700; margin-bottom:4px;
    }
    .summary-chip .chip-value {
      font-size:18px; font-weight:850; color:var(--text); line-height:1;
    }
    .section-head {
      display:flex; align-items:center; justify-content:space-between; margin:0 0 10px 0;
    }
    .section-title {
      margin:0; font-size:14px; font-weight:800; color:var(--text); letter-spacing:.01em;
    }
    .legend-wrap {
      display:flex; align-items:center; gap:8px; min-width:122px; justify-content:flex-end;
    }
    .legend-label { color:var(--muted); font-size:10px; line-height:1; }
    .legend-bar {
      width:76px; height:8px; border-radius:999px; border:1px solid #3a2a2e;
      background:linear-gradient(90deg,#2a2023 0%,#452228 18%,#61232d 34%,#7a1f2b 50%,#9a2a39 66%,#b9384a 80%,#d75569 92%,#ee7c8f 100%);
    }
    .heat-grid {
      display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:10px;
    }
    .heat-cell {
      min-height:96px; border:1px solid var(--border); border-radius:16px;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      padding:10px 6px; text-align:center; transition:background .18s ease;
    }
    .heat-zone {
      color:rgba(255,255,255,.38); font-size:10px; line-height:1; font-weight:700; margin-bottom:6px; letter-spacing:.08em;
    }
    .heat-pct {
      font-size:22px; line-height:1; font-weight:900; color:#f5f5f5; margin-bottom:8px;
    }
    .heat-detail {
      font-size:11px; line-height:1.1; color:#d3d7dd; font-weight:700; letter-spacing:.01em;
    }
    .heat-detail.muted { color:var(--muted-2); }
    @media (max-width:380px){
      .app { padding:10px; }
      .card { padding:14px; }
      .stat-card { min-height:96px; padding:12px; }
      .heat-cell { min-height:90px; }
      .heat-pct { font-size:20px; }
      .summary-chip .chip-value { font-size:16px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="card">
      <h1 class="title">Session Summary</h1>

      <div class="stats-grid">
        <div class="stat-card">
          <div>
            <div class="label">Pitches</div>
            <div class="value" id="countVal">0</div>
          </div>
          <div class="subtle" id="goalVal">Goal 0</div>
        </div>

        <div class="stat-card">
          <div>
            <div class="label">Points</div>
            <div class="value" id="pointsVal">0</div>
          </div>
          <div class="subtle" id="effVal">0% efficiency</div>
        </div>

        <div class="stat-card">
          <div>
            <div class="label">Strikes</div>
            <div class="value" id="strikesVal">0</div>
          </div>
          <div class="subtle" id="strikeRateVal">0% strike rate</div>
        </div>

        <div class="stat-card">
          <div>
            <div class="label">Balls</div>
            <div class="value" id="ballsVal">0</div>
          </div>
          <div class="subtle" id="ballRateVal">0% ball rate</div>
        </div>
      </div>

      <div class="summary-row">
        <div class="summary-chip">
          <span class="chip-label">Direct</span>
          <span class="chip-value" id="directHitsVal">0</span>
        </div>
        <div class="summary-chip">
          <span class="chip-label">Neighbor</span>
          <span class="chip-value" id="neighborHitsVal">0</span>
        </div>
        <div class="summary-chip">
          <span class="chip-label">Miss</span>
          <span class="chip-value" id="missesVal">0</span>
        </div>
      </div>

      <div class="section-head">
        <h2 class="section-title">Target Efficiency</h2>
        <div class="legend-wrap">
          <span class="legend-label">Low</span>
          <div class="legend-bar"></div>
          <span class="legend-label">High</span>
        </div>
      </div>

      <div class="heat-grid" id="heatGrid"></div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);

    const num = (key, fallback = 0) => {
      const raw = params.get(key);
      const n = Number(raw);
      return Number.isFinite(n) ? n : fallback;
    };

    const fmtPct = (value) => `${Math.round(value)}%`;
    const getCss = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

    const getHeatColor = (pct) => {
      if (!Number.isFinite(pct) || pct <= 0) return getCss('--heat-0');
      if (pct <= 12) return getCss('--heat-1');
      if (pct <= 24) return getCss('--heat-2');
      if (pct <= 36) return getCss('--heat-3');
      if (pct <= 50) return getCss('--heat-4');
      if (pct <= 64) return getCss('--heat-5');
      if (pct <= 78) return getCss('--heat-6');
      if (pct <= 90) return getCss('--heat-7');
      return getCss('--heat-8');
    };

    const count = num('count');
    const goal = num('goal');
    const strikes = num('strikes');
    const balls = num('balls');
    const points = num('points');
    const directHits = num('directHits');
    const neighborHits = num('neighborHits');
    const misses = num('misses');

    const possiblePoints = count * 3;
    const overallEfficiency = possiblePoints > 0 ? (points / possiblePoints) * 100 : 0;
    const strikeRate = count > 0 ? (strikes / count) * 100 : 0;
    const ballRate = count > 0 ? (balls / count) * 100 : 0;

    document.getElementById('countVal').textContent = count;
    document.getElementById('goalVal').textContent = `Goal ${goal || 0}`;
    document.getElementById('pointsVal').textContent = points;
    document.getElementById('effVal').textContent = `${fmtPct(overallEfficiency)} efficiency`;
    document.getElementById('strikesVal').textContent = strikes;
    document.getElementById('strikeRateVal').textContent = `${fmtPct(strikeRate)} strike rate`;
    document.getElementById('ballsVal').textContent = balls;
    document.getElementById('ballRateVal').textContent = `${fmtPct(ballRate)} ball rate`;
    document.getElementById('directHitsVal').textContent = directHits;
    document.getElementById('neighborHitsVal').textContent = neighborHits;
    document.getElementById('missesVal').textContent = misses;

    const heatGrid = document.getElementById('heatGrid');

    for (let zone = 1; zone <= 9; zone++) {
      const d = num(`d${zone}`);
      const n = num(`n${zone}`);
      const m = num(`m${zone}`);
      const targeted = d + n + m;
      const earned = (d * 3) + n;
      const possible = targeted * 3;
      const pct = possible > 0 ? (earned / possible) * 100 : null;

      const cell = document.createElement('div');
      cell.className = 'heat-cell';
      cell.style.background = pct === null ? getCss('--heat-0') : getHeatColor(pct);

      const zoneTag = document.createElement('div');
      zoneTag.className = 'heat-zone';
      zoneTag.textContent = `Z${zone}`;

      const pctEl = document.createElement('div');
      pctEl.className = 'heat-pct';
      pctEl.textContent = pct === null ? '—' : fmtPct(pct);

      const detailEl = document.createElement('div');
      detailEl.className = 'heat-detail' + (pct === null ? ' muted' : '');
      detailEl.textContent = `${d} / ${n} / ${m}`;

      cell.appendChild(zoneTag);
      cell.appendChild(pctEl);
      cell.appendChild(detailEl);
      heatGrid.appendChild(cell);
    }
  </script>
</body>
</html>
